name: Build and publish LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JavaScript
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Publish generated site to gh-pages branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/ljt-site
          cp -a _site /tmp/ljt-site
          touch /tmp/ljt-site/.nojekyll

          git fetch origin gh-pages
          rm -rf /tmp/ljt-gh-pages
          git worktree add -B gh-pages /tmp/ljt-gh-pages origin/gh-pages

          find /tmp/ljt-gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/ljt-site/. /tmp/ljt-gh-pages/

          cd /tmp/ljt-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit."
          else
            git commit -m "Publish LJT-Homepage build ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
