name: Test write

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages build type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
