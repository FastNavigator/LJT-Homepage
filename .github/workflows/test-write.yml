name: Test write

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show Pages JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds?per_page=3" || true
