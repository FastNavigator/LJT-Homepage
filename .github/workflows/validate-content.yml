name: Validate content and Jekyll build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply the recorded in-page link correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_pages/about.md')
          text = p.read_text(encoding='utf-8')
          old = '[HKUST NLP Group](https://github.com/FastNavigator/LJT-Homepage#academic-background)'
          new = '**HKUST NLP Group**'
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
              print('Corrected the HKUST NLP reference.')
          else:
              print('The correction target was not present; no file change was made.')
          PY
          if ! git diff --quiet -- _pages/about.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _pages/about.md
            git commit -m "Correct the HKUST NLP in-page reference"
            git push origin HEAD:master
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --baseurl /LJT-Homepage
        env:
          JEKYLL_ENV: production

      - name: Verify required rendered content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          for term in \
            "Junteng Liu" \
            "First-year Ph.D. candidate" \
            "Shanghai Jiao Tong University" \
            "MINIMAX" \
            "Tencent WXG" \
            "Shanghai AI Lab" \
            "Zhiyuan Honor Scholarship" \
            "SynLogic" \
            "Perception Bottleneck" \
            "Universal Truthfulness Hyperplane" \
            "In-Context Sharpness" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "tbK9jl4AAAAJ" \
            "junteng88716710"; do
            grep -Fq "$term" _site/index.html || { echo "Missing from About output: $term"; exit 1; }
            grep -Fq "$term" _site/publications/index.html || true
          done
          for term in \
            "SynLogic" \
            "Perception Bottleneck" \
            "Universal Truthfulness Hyperplane" \
            "In-Context Sharpness" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules"; do
            grep -Fq "$term" _site/publications/index.html || { echo "Missing from Publications output: $term"; exit 1; }
          done
          echo "All required content checks passed."
